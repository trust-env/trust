name: tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --lib --verbose

  generator-integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run generator integration tests
        run: cargo test --test 'generator_*' --verbose

  e2e:
    runs-on: ubuntu-latest
    needs: generator-integration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trust_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trust_e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # e2e tests generate real Rust projects that depend on `common` (a
      # private BH-World repo) and `cargo build` them for real, patched via
      # `[patch]` to a local checkout under `mod/` instead of fetching over
      # SSH — this is the one step in the whole suite that needs a token,
      # to check that local checkout out in the first place. Extend this if
      # a future e2e fixture needs `auth` or `user_permission` too.
      - name: Check out local common dependency
        run: |
          git clone "https://x-access-token:${{ secrets.BH_WORLD_CI_TOKEN }}@github.com/BH-World/common.git" mod/common

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run e2e tests
        run: cargo test --test 'e2e_*' --verbose

  coverage:
    runs-on: ubuntu-latest
    needs: [unit, generator-integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce coverage floor over the compiler's own source
        run: |
          cargo llvm-cov --lib --test 'generator_*' --summary-only --fail-under-lines 70 \
            --ignore-filename-regex '(^|/)tests/|(^|/)out/|src/main\.rs'

      - name: Generate HTML coverage report
        run: |
          cargo llvm-cov --lib --test 'generator_*' --html \
            --ignore-filename-regex '(^|/)tests/|(^|/)out/|src/main\.rs'

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html
