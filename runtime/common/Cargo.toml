[package]
name = "common"
version = "0.1.0"
edition = "2021"
description = "Runtime support shared by every project generated by the trust compiler"

[dependencies]
axum = "0.8"
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "macros"] }
